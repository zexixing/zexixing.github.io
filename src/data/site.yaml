research:
  - title: "Cometary Water And Volatile Evolution"
    text: "Water is my central tracer for understanding cometary activity. I use near-ultraviolet OH emission, mainly with Swift/UVOT, to measure water production and follow how cometary ices are exposed, depleted, and redistributed through the coma."
  - title: "Interstellar Comets"
    text: "I led the Swift water measurements for 2I/Borisov and 3I/ATLAS. These campaigns connect individual detections to time evolution: from 2I's unusually fast post-perihelion decline to 3I's transition through CO2-rich, H2O-rich, and CO-rich activity regimes."
  - title: "UV Small-Body Observing Toolchain"
    text: "Much of my work is at the interface between science and operations: planning observations for non-sidereal targets, removing field-star contamination, reducing motion smearing with event mode, adapting grism extraction for extended sources, and turning these methods into reusable software such as uvotimgpy."
