highlights:
  - "Led Swift/UVOT water-activity measurements for both active interstellar comets observed to date."
  - "Develops observing strategies and reduction methods for faint, moving, and extended Solar System targets."
  - "Builds reusable small-body tools for UVOT imaging and grism spectroscopy."
